# fly.toml — generated for JamesLivengood/Towers-React
# Replace "towers-react" with your actual Fly app name (set during `flyctl launch`)

app = "towers-react"
primary_region = "dfw"  # Dallas

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "bundle exec rails db:migrate"

[env]
  RAILS_ENV = "production"
  RAILS_LOG_TO_STDOUT = "true"
  RAILS_SERVE_STATIC_FILES = "true"
  MALLOC_ARENA_MAX = "2"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Uncomment to add a Sidekiq worker process:
# [[processes]]
#   name = "worker"
#   entrypoint = ["bundle", "exec", "sidekiq"]
